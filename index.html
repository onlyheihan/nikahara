<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onlyheihan — Digital Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #f8f5f0;
      color: #333;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .brand {
      font-size: 18px;
      letter-spacing: 5px;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 48px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 17px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .button {
      display: inline-block;
      padding: 15px 30px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-family: Arial, sans-serif;
    }

    .button:hover {
      opacity: 0.85;
    }

    .footer {
      margin-top: 60px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="brand">NIKAHARA</div>

    <h1>Digital Wedding Invitation</h1>

    <p class="subtitle">
      Your Story. Your Wedding. Your Invitation.
    </p>

    <a href="[https://google.com](https://google.com)" class="button">
      PILIH TEMPLATE
    </a>

    <div class="footer">
      © 2026 NIKAHARA
    </div>

  </section>

</body>
</html>
