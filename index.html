### 🛠️ Langkah Lengkapnya:

#### 1. Persiapkan File Musik
* Cari file lagu/musik romantis berformat **`.mp3`** di HP/laptop kamu.
* *Rename* (ubah nama) filenya menjadi **`musik.mp3`**.
* Upload file `musik.mp3` tersebut ke repository **`onlyheihan`** di GitHub (pakai tombol **Add file** > **Upload files** seperti saat upload gambar tadi).

---

#### 2. Update Kode di `index.html`
Edit file **`index.html`** kamu di GitHub, hapus seluruh kodenya, lalu tempel (*paste*) kode di bawah ini:

```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Fulan & Fulanah</title>
    <style>

        }
        body {
            font-family: Georgia, serif;
            background-color: #f4f6f8;

            font-weight: bold;
        }

        }

    <!-- Musik Latar -->
    <audio id="bg-music" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <!-- Gambar Utama -->
        <img src="undangan.jpg" alt="Undangan NIKAHARA" class="invitation-img">

        <!-- Countdown Timer -->
        <div class="countdown-title">Menghitung Hari Pernikahan</div>

        </div>
    </div>

    <script>
        // Jalankan Musik Latar
        function playAudio() {
            var music = document.getElementById("bg-music");
            music.play();
            alert("Selamat mendengarkan! 🎉");
        }

        // Jalankan Hitung Mundur
        // Silakan sesuaikan tanggal pernikahan di bawah ini (Format: Tahun-Bulan-Tanggal)
        var targetDate = new Date("2026-12-31T09:00:00").getTime();

        var countdown = setInterval(function() {
            var now = new Date().getTime();
            var distance = targetDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;

            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("timer").innerHTML = "<b>Acara Telah Berlangsung</b>";
            }
        }, 1000);
    </script>
