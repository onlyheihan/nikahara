<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYHEIHAN - Digital Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Georgia, serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        .invitation-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
        .button-group {
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            width: 80%;
            padding: 12px 20px;
            background-color: #2b3a4a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: bold;
            transition: 0.3s;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="undangan.jpg" alt="Undangan ONLYHEIHAN" class="invitation-img">

        <div class="button-group">
            <!-- Link ke Instagram -->
            <a href="https://instagram.com/username_kamu" target="_blank" class="btn">INSTAGRAM KAMI</a>
        </div>

        <div class="footer">
            &copy; 2026 ONLYHEIHAN
        </div>
    </div>

</body>
</html>
