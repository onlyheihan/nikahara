<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Fulan & Fulanah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Georgia, serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        .invitation-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* Kotak Nama Tamu */
        .guest-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
        }
        .guest-title {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .guest-name {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
        }
        
        /* Section Countdown */
        .countdown-title {
            margin-top: 20px;
            font-size: 14px;
            color: #2b3a4a;
            font-weight: bold;
        }
        #timer {
            display: flex;
            justify-content: space-around;
            margin: 12px 0 20px 0;
        }
        .time-box {
            background: #2b3a4a;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            width: 22%;
        }
        .time-box span {
            display: block;
            font-size: 18px;
            font-weight: bold;
        }
        .time-box small {
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Tombol */
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-bottom: 10px;
            background-color: #2b3a4a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #2b3a4a;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Musik Latar -->
    <audio id="bg-music" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <!-- Gambar Utama -->
        <img src="undangan.jpg" alt="Undangan ONLYHEIHAN" class="invitation-img">

        <!-- KOTAK NAMA TAMU OTOMATIS -->
        <div class="guest-box">
            <div class="guest-title">Kepada Yth. Bapak/Ibu/Saudara/i:</div>
            <div class="guest-name" id="nama-tamu">Tamu Kurang ajar</div>
        </div>

        <!-- Countdown Timer -->
        <div class="countdown-title">Menghitung Hari Pernikahan</div>
        <div id="timer">
            <div class="time-box"><span id="days">00</span><small>Hari</small></div>
            <div class="time-box"><span id="hours">00</span><small>Jam</small></div>
            <div class="time-box"><span id="minutes">00</span><small>Menit</small></div>
            <div class="time-box"><span id="seconds">00</span><small>Detik</small></div>
        </div>

        <!-- Tombol Interaktif -->
        <button class="btn" onclick="playAudio()">🎵 BUKA UNDANGAN & PUTAR MUSIK</button>
        <a href="https://maps.google.com" target="_blank" class="btn btn-secondary">📍 PETAKAN LOKASI (GOOGLE MAPS)</a>
        <a href="https://instagram.com/onlyheihan" target="_blank" class="btn btn-secondary">📸 INSTAGRAM KAMI</a>
<a href="template.html" class="btn btn-secondary">🎨 PILIH TEMPLATE</a>
        <div class="footer">
            &copy; 2026 ONLYHEIHAN
        </div>
    </div>

    <script>
        // SCRIPT MENGAMBIL NAMA TAMU DARI URL (?to=Nama)
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        if (nama) {
            document.getElementById('nama-tamu kurang ajar').innerText = decodeURIComponent(nama);
        }

        // Jalankan Musik Latar
        function playAudio() {
            var music = document.getElementById("bg-music");
            music.play();
            alert("Selamat mendengarkan! 🎉");
        }

        // Hitung Mundur
        var targetDate = new Date("2026-12-31T09:00:00").getTime();
        var countdown = setInterval(function() {
            var now = new Date().getTime();
            var distance = targetDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;

            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("timer").innerHTML = "<b>Acara Telah Berlangsung</b>";
            }
        }, 1000);
    </script>

</body>
</html>
