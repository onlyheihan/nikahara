<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAHARA - Pilihan Template Undangan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; padding: 20px 15px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #1e293b; }
        .header p { font-size: 13px; color: #64748b; margin-top: 5px; }
        .catalog-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: #ffffff; border-radius: 16px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
        .card h3 { font-size: 16px; color: #1e293b; margin-bottom: 6px; }
        .card p { font-size: 12px; color: #64748b; margin-bottom: 15px; }
        .btn { display: inline-block; width: 100%; padding: 10px 0; background-color: #2b3a4a; color: #ffffff; text-decoration: none; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .back-btn { display: block; text-align: center; margin: 30px auto 10px; color: #64748b; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Katalog Template NIKAHARA</h1>
        <p>Pilih desain undangan digital favoritmu</p>
    </div>

    <div class="catalog-container">
        <!-- Template 1 -->
        <div class="card">
            <img src="undangan.jpg" alt="Template Floral Blue">
            <h3>01. Blue Floral Elegant</h3>
            <p>Tema bunga biru dengan nuansa elegan dan musik latar romantis.</p>
            <a href="index.html?to=Contoh%20Tamu" class="btn">LIHAT DEMO</a>
        </div>

        <!-- Template 2 -->
        <div class="card">
            <img src="undangan 2.jpg" alt="Template Gold Warm">
            <h3>02. Classic Gold</h3>
            <p>Tema warna emas mewah dengan gaya klasik modern.</p>
            <a href="#" class="btn" style="background-color: #94a3b8;">SEGERA HADIR</a>
        </div>
    </div>

    <a href="index.html" class="back-btn">← Kembali ke Halaman Utama</a>

</body>
</html>
